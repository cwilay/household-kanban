<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Household Kanban</title> <style> * { box-sizing: border-box; } body { margin: 0; font-family: "Georgia", "Times New Roman", serif; background: radial-gradient(circle at 10% 10%, #ffffff 0 2px, transparent 3px), radial-gradient(circle at 90% 20%, #ffffff 0 2px, transparent 3px), radial-gradient(circle at 30% 90%, #ffffff 0 2px, transparent 3px), linear-gradient(135deg, #fff5f9, #fde4ef, #fff8fb); background-size: 55px 55px, 70px 70px, 90px 90px, 100% 100%; color: #633b4d; min-height: 100vh; } /* 🎀 HEADER 🎀 */ header { position: relative; display: flex; justify-content: space-between; align-items: center; padding: 22px 30px; background: rgba(255, 248, 252, 0.96); border-bottom: 3px double #e9a8c2; box-shadow: 0 4px 18px rgba(177, 76, 119, 0.12); } header::before { content: "୨୧"; position: absolute; left: 50%; top: 4px; transform: translateX(-50%); color: #d979a1; font-size: 18px; } header h1 { margin: 0; font-size: 26px; color: #b94f7d; letter-spacing: 0.5px; text-shadow: 1px 1px #fff; } header h1::after { content: " ♡"; color: #df719d; } #addTaskBtn { background: linear-gradient(135deg, #e889ad, #d96594); color: white; border: 2px solid #f5b8cf; padding: 11px 20px; border-radius: 25px; font-family: Georgia, serif; font-size: 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(180, 70, 115, 0.2), inset 0 1px rgba(255,255,255,0.7); transition: 0.2s ease; } #addTaskBtn::before { content: "🎀 "; } #addTaskBtn:hover { background: linear-gradient(135deg, #dc709b, #c95182); transform: translateY(-2px); box-shadow: 0 6px 14px rgba(180, 70, 115, 0.25); } /* 🌸 BOARD 🌸 */ .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 28px; min-height: calc(100vh - 80px); } .column { position: relative; background: rgba(255, 232, 241, 0.9); border: 2px solid #efb5cb; border-radius: 22px; padding: 17px; min-height: 500px; box-shadow: 0 7px 20px rgba(170, 77, 116, 0.1), inset 0 0 25px rgba(255,255,255,0.45); } .column::before { content: "♡"; position: absolute; top: 7px; left: 13px; color: #e09ab7; font-size: 13px; } .column::after { content: "♡"; position: absolute; top: 7px; right: 13px; color: #e09ab7; font-size: 13px; } .column:nth-child(2) { background: rgba(255, 237, 245, 0.92); } .column:nth-child(3) { background: rgba(250, 222, 235, 0.92); } .column:nth-child(4) { background: rgba(255, 242, 248, 0.94); } .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 17px; padding: 8px 4px; border-bottom: 1px dashed #df9eb8; } .column-header h2 { margin: 0; font-size: 17px; color: #9f466b; font-weight: bold; } .column-header h2::before { content: "♡ "; color: #d76d98; } .task-count { background: #fff7fb; color: #b54e79; padding: 4px 10px; border-radius: 20px; border: 1px solid #efb5cc; font-size: 12px; font-weight: bold; } /* 🎀 TASK CARDS 🎀 */ .task { position: relative; background: linear-gradient(145deg, #fffdfd, #fff7fa); border: 1px solid #efc2d4; border-radius: 17px; padding: 15px; margin-bottom: 13px; box-shadow: 0 4px 10px rgba(169, 75, 112, 0.11), inset 0 0 12px rgba(255, 215, 231, 0.25); cursor: grab; transition: 0.2s ease; } .task::after { content: "♡"; position: absolute; bottom: 7px; right: 10px; color: #efbfd2; font-size: 12px; } .task:hover { transform: translateY(-3px) rotate(-0.3deg); border-color: #df91b0; box-shadow: 0 7px 15px rgba(169, 75, 112, 0.16), inset 0 0 15px rgba(255, 215, 231, 0.35); } .task:active { cursor: grabbing; } .task h3 { margin: 0 0 8px; font-size: 15px; color: #6e3b50; } .task h3::before { content: "♡ "; color: #d66d98; } .task p { margin: 0 0 12px; color: #916779; font-size: 13px; line-height: 1.45; } .task-meta { display: flex; justify-content: space-between; font-size: 12px; color: #a66f84; } .delete-btn { border: none; background: transparent; color: #d69ab3; cursor: pointer; font-size: 19px; transition: 0.2s; } .delete-btn:hover { color: #d44c7d; transform: scale(1.2); } .drag-over { background: #f8c9dc !important; border-color: #db82a8 !important; } /* 🎀 MODAL 🎀 */ .modal { display: none; position: fixed; inset: 0; background: rgba(108, 48, 73, 0.4); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 20px; } .modal-content { position: relative; background: linear-gradient(rgba(255,250,253,0.96), rgba(255,244,249,0.96)); border: 3px double #e7a2bd; width: 100%; max-width: 450px; border-radius: 25px; padding: 28px; box-shadow: 0 15px 40px rgba(103, 44, 69, 0.2), inset 0 0 25px rgba(255, 204, 224, 0.3); } .modal-content::before { content: "🎀"; display: block; text-align: center; font-size: 28px; margin-bottom: 4px; } .modal-content::after { content: "♡ ˚₊‧ ୨୧ ‧₊˚ ♡"; display: block; text-align: center; color: #d8789f; margin-top: 18px; } .modal-content h2 { margin-top: 0; text-align: center; color: #b44d79; font-size: 22px; } .form-group { margin-bottom: 16px; } .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: bold; color: #81445d; } .form-group label::before { content: "♡ "; color: #d9789e; } .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 11px; border: 1px solid #e8b1c8; background: #fffafd; color: #633b4d; border-radius: 12px; font-family: Georgia, serif; font-size: 14px; outline: none; } .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #d9789f; box-shadow: 0 0 0 3px #fbe0eb; } .form-group textarea { min-height: 80px; resize: vertical; } .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; } .cancel-btn, .save-btn { border: none; padding: 10px 18px; border-radius: 18px; cursor: pointer; font-family: Georgia, serif; font-weight: bold; } .cancel-btn { background: #f4dce7; color: #875066; border: 1px solid #e6b6ca; } .save-btn { background: linear-gradient(135deg, #e889ad, #d76494); color: white; border: 1px solid #efb4ca; } .save-btn::before { content: "🎀 "; } .save-btn:hover { background: linear-gradient(135deg, #dc709b, #c95182); } /* 🌷 RESPONSIVE 🌷 */ @media (max-width: 900px) { .board { grid-template-columns: repeat(2, 1fr); } } @media (max-width: 600px) { .board { grid-template-columns: 1fr; padding: 15px; } header { padding: 18px; } header h1 { font-size: 20px; } } </style>
 </head> <body> <header> <h1>🏠 Household Board</h1> <button id="addTaskBtn">+ Add Task</button> </header> <main class="board"> <section class="column" data-status="todo"> <div class="column-header"> <h2>To Do</h2> <span class="task-count">0</span> </div> <div class="tasks"></div> </section> <section class="column" data-status="progress"> <div class="column-header"> <h2>In Progress</h2> <span class="task-count">0</span> </div> <div class="tasks"></div> </section> <section class="column" data-status="blocked"> <div class="column-header"> <h2>Blocked</h2> <span class="task-count">0</span> </div> <div class="tasks"></div> </section> <section class="column" data-status="done"> <div class="column-header"> <h2>Done</h2> <span class="task-count">0</span> </div> <div class="tasks"></div> </section> </main> <div class="modal" id="taskModal"> <div class="modal-content">
<h2>Add Task</h2>

<div class="form-group">
  <label>Task</label>
  <input type="text" id="taskTitle" placeholder="e.g. Take out trash">
</div>

<div class="form-group">
  <label>Description</label>
  <textarea id="taskDescription" placeholder="Optional details..."></textarea>
</div>

<div class="form-group">
  <label>Assigned To</label>
  <input type="text" id="taskAssignee" placeholder="e.g. Alex">
</div>

<div class="form-group">
  <label>Due Date</label>
  <input type="date" id="taskDueDate">
</div>

<div class="form-group">
  <label>Status</label>
  <select id="taskStatus">
    <option value="todo">To Do</option>
    <option value="progress">In Progress</option>
    <option value="blocked">Blocked</option>
    <option value="done">Done</option>
  </select>
</div>

<div class="modal-actions">
  <button class="cancel-btn" id="cancelBtn">Cancel</button>
  <button class="save-btn" id="saveBtn">Add Task</button>
</div>

</div> </div> <!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
const SUPABASE_URL = "https://pbbletvgkxpzzyykharf.supabase.co";
const SUPABASE_KEY = "sb_publishable_KFrUQF26oT0w5BfWaLMvRw_B-M_rjQR";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let tasks = [];

const modal = document.getElementById("taskModal");
const addTaskBtn = document.getElementById("addTaskBtn");
const cancelBtn = document.getElementById("cancelBtn");
const saveBtn = document.getElementById("saveBtn");

addTaskBtn.addEventListener("click", () => {
  modal.style.display = "flex";
});

cancelBtn.addEventListener("click", () => {
  modal.style.display = "none";
});

modal.addEventListener("click", (event) => {
  if (event.target === modal) {
    modal.style.display = "none";
  }
});

async function loadTasks() {
  const { data, error } = await supabaseClient
    .from("tasks")
    .select("*")
    .order("created_at", { ascending: true });

  if (error) {
    console.error("Error loading tasks:", error);
    alert("Could not load tasks. Check your Supabase settings.");
    return;
  }

  tasks = data || [];
  renderTasks();
}

saveBtn.addEventListener("click", async () => {
  const title = document.getElementById("taskTitle").value.trim();

  if (!title) {
    alert("Please enter a task name.");
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = "Saving...";

  const newTask = {
    title: title,
    description: document.getElementById("taskDescription").value.trim(),
    assignee: document.getElementById("taskAssignee").value.trim(),
    due_date: document.getElementById("taskDueDate").value || null,
    status: document.getElementById("taskStatus").value
  };

  const { error } = await supabaseClient
    .from("tasks")
    .insert(newTask);

  if (error) {
    console.error("Error adding task:", error);
    alert("Could not add task.");
  } else {
    document.getElementById("taskTitle").value = "";
    document.getElementById("taskDescription").value = "";
    document.getElementById("taskAssignee").value = "";
    document.getElementById("taskDueDate").value = "";
    document.getElementById("taskStatus").value = "todo";

    modal.style.display = "none";
    await loadTasks();
  }

  saveBtn.disabled = false;
  saveBtn.textContent = "Add Task";
});

function renderTasks() {
  document.querySelectorAll(".tasks").forEach(container => {
    container.innerHTML = "";
  });

  tasks.forEach(task => {
    const column = document.querySelector(
      `.column[data-status="${task.status}"]`
    );

    if (!column) return;

    const container = column.querySelector(".tasks");

    const card = document.createElement("div");
    card.className = "task";
    card.draggable = true;
    card.dataset.id = task.id;

    card.innerHTML = `
      <div style="display:flex; justify-content:space-between;">
        <h3>${escapeHTML(task.title)}</h3>
        <button class="delete-btn" data-id="${task.id}">×</button>
      </div>

      ${
        task.description
          ? `<p>${escapeHTML(task.description)}</p>`
          : ""
      }

      <div class="task-meta">
        <span>
          ${task.assignee ? "👤 " + escapeHTML(task.assignee) : ""}
        </span>

        <span>
          ${task.due_date ? "📅 " + task.due_date : ""}
        </span>
      </div>
    `;

    card.addEventListener("dragstart", dragStart);

    const deleteButton = card.querySelector(".delete-btn");

    deleteButton.addEventListener("click", () => {
      deleteTask(task.id);
    });

    container.appendChild(card);
  });

  updateCounts();
}

async function deleteTask(id) {
  if (!confirm("Delete this task?")) {
    return;
  }

  const { error } = await supabaseClient
    .from("tasks")
    .delete()
    .eq("id", id);

  if (error) {
    console.error("Error deleting task:", error);
    alert("Could not delete task.");
    return;
  }

  await loadTasks();
}

function dragStart(event) {
  event.dataTransfer.setData(
    "text/plain",
    event.currentTarget.dataset.id
  );
}

document.querySelectorAll(".column").forEach(column => {

  column.addEventListener("dragover", event => {
    event.preventDefault();
    column.classList.add("drag-over");
  });

  column.addEventListener("dragleave", () => {
    column.classList.remove("drag-over");
  });

  column.addEventListener("drop", async event => {
    event.preventDefault();
    column.classList.remove("drag-over");

    const id = Number(
      event.dataTransfer.getData("text/plain")
    );

    const newStatus = column.dataset.status;

    const { error } = await supabaseClient
      .from("tasks")
      .update({ status: newStatus })
      .eq("id", id);

    if (error) {
      console.error("Error moving task:", error);
      alert("Could not move task.");
      return;
    }

    await loadTasks();
  });

});

function updateCounts() {
  document.querySelectorAll(".column").forEach(column => {

    const status = column.dataset.status;

    const count = tasks.filter(
      task => task.status === status
    ).length;

    column.querySelector(".task-count").textContent = count;

  });
}

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

loadTasks();
</script>
