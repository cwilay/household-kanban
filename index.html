<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Household Kanban</title> <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: #fff0f6;
    color: #5a3042;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 30px;
    background: #fff8fb;
    border-bottom: 2px solid #f3c4d8;
    box-shadow: 0 2px 10px rgba(180, 90, 130, 0.08);
  }

  header h1 {
    margin: 0;
    font-size: 24px;
    color: #b84d78;
  }

  #addTaskBtn {
    background: #e889ad;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(200, 100, 140, 0.2);
  }

  #addTaskBtn:hover {
    background: #d96f98;
    transform: translateY(-1px);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    padding: 25px;
    min-height: calc(100vh - 80px);
  }

  .column {
    background: #f9dce8;
    border: 1px solid #f2bfd3;
    border-radius: 18px;
    padding: 15px;
    min-height: 500px;
    box-shadow: 0 4px 12px rgba(180, 90, 130, 0.08);
  }

  .column:nth-child(2) {
    background: #fce5ee;
  }

  .column:nth-child(3) {
    background: #f8d6e4;
  }

  .column:nth-child(4) {
    background: #fcebf2;
  }

  .column-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .column-header h2 {
    margin: 0;
    font-size: 16px;
    color: #9d4568;
  }

  .task-count {
    background: #fff5f9;
    color: #b84d78;
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .task {
    background: #fffafb;
    border: 1px solid #f3ccdc;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 3px 8px rgba(180, 90, 130, 0.1);
    cursor: grab;
  }

  .task:hover {
    box-shadow: 0 5px 12px rgba(180, 90, 130, 0.15);
    transform: translateY(-1px);
  }

  .task:active {
    cursor: grabbing;
  }

  .task h3 {
    margin: 0 0 8px;
    font-size: 15px;
    color: #68394d;
  }

  .task p {
    margin: 0 0 12px;
    color: #8b6574;
    font-size: 13px;
  }

  .task-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #a06f83;
  }

  .delete-btn {
    border: none;
    background: none;
    color: #d6a1b6;
    cursor: pointer;
    font-size: 18px;
  }

  .delete-btn:hover {
    color: #d94f7d;
  }

  .drag-over {
    background: #f4bfd4 !important;
  }

  /* Modal */

  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(120, 55, 80, 0.35);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-content {
    background: #fff9fc;
    border: 2px solid #f2c5d8;
    width: 100%;
    max-width: 450px;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(130, 60, 90, 0.15);
  }

  .modal-content h2 {
    margin-top: 0;
    color: #b84d78;
  }

  .form-group {
    margin-bottom: 15px;
  }

  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #81455e;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 10px;
    border: 1px solid #efbfd2;
    background: #fffafd;
    color: #5a3042;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    border-color: #df83a9;
    box-shadow: 0 0 0 3px #fce3ed;
  }

  .form-group textarea {
    min-height: 80px;
    resize: vertical;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }

  .cancel-btn,
  .save-btn {
    border: none;
    padding: 10px 16px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
  }

  .cancel-btn {
    background: #f5dce6;
    color: #875066;
  }

  .save-btn {
    background: #e889ad;
    color: white;
  }

  .save-btn:hover {
    background: #d96f98;
  }

  @media (max-width: 900px) {
    .board {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 600px) {
    .board {
      grid-template-columns: 1fr;
    }
  }
</style>
 </head> <body> <header> <h1>🏠 Household Board</h1> <button id="addTaskBtn">+ Add Task</button> </header> <main class="board"> <section class="column" data-status="todo"> <div class="column-header"> <h2>To Do</h2> <span class="task-count">0</span> </div> <div class="tasks"></div> </section> <section class="column" data-status="progress"> <div class="column-header"> <h2>In Progress</h2> <span class="task-count">0</span> </div> <div class="tasks"></div> </section> <section class="column" data-status="blocked"> <div class="column-header"> <h2>Blocked</h2> <span class="task-count">0</span> </div> <div class="tasks"></div> </section> <section class="column" data-status="done"> <div class="column-header"> <h2>Done</h2> <span class="task-count">0</span> </div> <div class="tasks"></div> </section> </main> <div class="modal" id="taskModal"> <div class="modal-content">
<h2>Add Task</h2>

<div class="form-group">
  <label>Task</label>
  <input type="text" id="taskTitle" placeholder="e.g. Take out trash">
</div>

<div class="form-group">
  <label>Description</label>
  <textarea id="taskDescription" placeholder="Optional details..."></textarea>
</div>

<div class="form-group">
  <label>Assigned To</label>
  <input type="text" id="taskAssignee" placeholder="e.g. Alex">
</div>

<div class="form-group">
  <label>Due Date</label>
  <input type="date" id="taskDueDate">
</div>

<div class="form-group">
  <label>Status</label>
  <select id="taskStatus">
    <option value="todo">To Do</option>
    <option value="progress">In Progress</option>
    <option value="blocked">Blocked</option>
    <option value="done">Done</option>
  </select>
</div>

<div class="modal-actions">
  <button class="cancel-btn" id="cancelBtn">Cancel</button>
  <button class="save-btn" id="saveBtn">Add Task</button>
</div>

</div> </div> <!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<script>
const SUPABASE_URL = "https://pbbletvgkxpzzyykharf.supabase.co";
const SUPABASE_KEY = "sb_publishable_KFrUQF26oT0w5BfWaLMvRw_B-M_rjQR";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let tasks = [];

const modal = document.getElementById("taskModal");
const addTaskBtn = document.getElementById("addTaskBtn");
const cancelBtn = document.getElementById("cancelBtn");
const saveBtn = document.getElementById("saveBtn");

addTaskBtn.addEventListener("click", () => {
  modal.style.display = "flex";
});

cancelBtn.addEventListener("click", () => {
  modal.style.display = "none";
});

modal.addEventListener("click", (event) => {
  if (event.target === modal) {
    modal.style.display = "none";
  }
});

async function loadTasks() {
  const { data, error } = await supabaseClient
    .from("tasks")
    .select("*")
    .order("created_at", { ascending: true });

  if (error) {
    console.error("Error loading tasks:", error);
    alert("Could not load tasks. Check your Supabase settings.");
    return;
  }

  tasks = data || [];
  renderTasks();
}

saveBtn.addEventListener("click", async () => {
  const title = document.getElementById("taskTitle").value.trim();

  if (!title) {
    alert("Please enter a task name.");
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = "Saving...";

  const newTask = {
    title: title,
    description: document.getElementById("taskDescription").value.trim(),
    assignee: document.getElementById("taskAssignee").value.trim(),
    due_date: document.getElementById("taskDueDate").value || null,
    status: document.getElementById("taskStatus").value
  };

  const { error } = await supabaseClient
    .from("tasks")
    .insert(newTask);

  if (error) {
    console.error("Error adding task:", error);
    alert("Could not add task.");
  } else {
    document.getElementById("taskTitle").value = "";
    document.getElementById("taskDescription").value = "";
    document.getElementById("taskAssignee").value = "";
    document.getElementById("taskDueDate").value = "";
    document.getElementById("taskStatus").value = "todo";

    modal.style.display = "none";
    await loadTasks();
  }

  saveBtn.disabled = false;
  saveBtn.textContent = "Add Task";
});

function renderTasks() {
  document.querySelectorAll(".tasks").forEach(container => {
    container.innerHTML = "";
  });

  tasks.forEach(task => {
    const column = document.querySelector(
      `.column[data-status="${task.status}"]`
    );

    if (!column) return;

    const container = column.querySelector(".tasks");

    const card = document.createElement("div");
    card.className = "task";
    card.draggable = true;
    card.dataset.id = task.id;

    card.innerHTML = `
      <div style="display:flex; justify-content:space-between;">
        <h3>${escapeHTML(task.title)}</h3>
        <button class="delete-btn" data-id="${task.id}">×</button>
      </div>

      ${
        task.description
          ? `<p>${escapeHTML(task.description)}</p>`
          : ""
      }

      <div class="task-meta">
        <span>
          ${task.assignee ? "👤 " + escapeHTML(task.assignee) : ""}
        </span>

        <span>
          ${task.due_date ? "📅 " + task.due_date : ""}
        </span>
      </div>
    `;

    card.addEventListener("dragstart", dragStart);

    const deleteButton = card.querySelector(".delete-btn");

    deleteButton.addEventListener("click", () => {
      deleteTask(task.id);
    });

    container.appendChild(card);
  });

  updateCounts();
}

async function deleteTask(id) {
  if (!confirm("Delete this task?")) {
    return;
  }

  const { error } = await supabaseClient
    .from("tasks")
    .delete()
    .eq("id", id);

  if (error) {
    console.error("Error deleting task:", error);
    alert("Could not delete task.");
    return;
  }

  await loadTasks();
}

function dragStart(event) {
  event.dataTransfer.setData(
    "text/plain",
    event.currentTarget.dataset.id
  );
}

document.querySelectorAll(".column").forEach(column => {

  column.addEventListener("dragover", event => {
    event.preventDefault();
    column.classList.add("drag-over");
  });

  column.addEventListener("dragleave", () => {
    column.classList.remove("drag-over");
  });

  column.addEventListener("drop", async event => {
    event.preventDefault();
    column.classList.remove("drag-over");

    const id = Number(
      event.dataTransfer.getData("text/plain")
    );

    const newStatus = column.dataset.status;

    const { error } = await supabaseClient
      .from("tasks")
      .update({ status: newStatus })
      .eq("id", id);

    if (error) {
      console.error("Error moving task:", error);
      alert("Could not move task.");
      return;
    }

    await loadTasks();
  });

});

function updateCounts() {
  document.querySelectorAll(".column").forEach(column => {

    const status = column.dataset.status;

    const count = tasks.filter(
      task => task.status === status
    ).length;

    column.querySelector(".task-count").textContent = count;

  });
}

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

loadTasks();
</script>
